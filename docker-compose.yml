services:

    # PHP / Laravel
    php:
        build: .docker/php
        ports:
            - "127.0.0.1:5173:5173"
        volumes:
            - .:/var/www:cached

    # Nginx
    nginx:
        image: nginx
        ports:
            - "127.0.0.1:8000:80"
        volumes:
            - .:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - php

    # MySQL Database
    db:
        image: mysql:8.1
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - .docker/db/data:/var/lib/mysql
            - .docker/logs:/var/log/mysql
            - .docker/db/my.cnf:/etc/mysql/conf.d/my.cnf
            - .docker/db/sql:/docker-entrypoint-initdb.d
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    # phpMyAdmin
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "127.0.0.1:8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 1
        volumes:
            - .docker/phpmyadmin/sessions:/sessions
        depends_on:
            - db

    # Adminer
    adminer:
        image: adminer
        ports:
            - "127.0.0.1:9090:8080"
        depends_on:
            - db

    # Mailpit
    mail:
        image: axllent/mailpit:latest
        ports:
            - "127.0.0.1:8025:8025"
            - "127.0.0.1:1025:1025"

    # Redis
    redis:
        image: redis:latest
        command: redis-server --appendonly yes
        volumes:
            - .docker/redis/data:/data
        ports:
            - "127.0.0.1:6380:6379"